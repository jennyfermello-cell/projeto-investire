{% extends "base.html" %}

{% block title %}Investire - Página de Login{% endblock %}

{% block content %}

  	<div class="container">
		<div class="col-lg-4 offset-lg-4 col-sm-12">

	  		<form action="{{url_for('autenticar')}}" method="post">
	  				<h1 class="text-center">Login</h1>
	  				
	  				<div class="input-group mb-3">
	  					<span class="input-group-text">
							<i class="bi bi-envelope"></i>
						</span>
	  					<input type="email" name="email" id="email"
	  						placeholder="E-mail" required="required"
	  						class="form-control">
	  				</div>
	  				
	  				<div class="input-group mb-3">
	  					<span class="input-group-text">
	  						<i class="bi bi-file-lock"></i>
	  					</span>
	  					<input type="password" name="senha" id="senha"
	  						placeholder="Senha" required="required"
	  						class="form-control">
	  				</div>
	  				
	  				<div class="mb-3">
	  					<button type="submit" class="btn btn-primary" name="action" 
	  						value="login">Login</button>
	  				</div>
	  				<div class="mb-3">
	  					<a href="{{url_for('cadastro_usuario')}}" id="link"
	  						class="btn btn-secondary">Cadastrar</a>
	  				</div>
					<p class="text-center mt-3">
    					<a href="{{ url_for('index') }}">← Voltar para a página inicial</a>
					</p>
	  		</form>
  		</div>
  	</div>

{% endblock %}
